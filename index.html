<!DOCTYPE html>
<!-- VERSION 2.8 — kort viser altid alt indhold + mere luft i siderne -->
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Program – Good Vibes Only Festival 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black: #0f0f0f; --off-black: #1a1a18; --orange: #E8891A;
  --white: #f5f3ee; --muted: #888880; --card: #222220;
  --border: rgba(255,255,255,0.08);
  --s0: #F5A623; --s1: #E8524A; --s2: #F0C030; --s3: #5B9BD5;
}

html, body { height: 100%; width: 100%; overflow: hidden; background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; }

/* ── HEADER ── */
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--off-black); border-bottom: 1px solid var(--border);
  padding: 10px 16px 6px;
}
.header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; }
.logo span { color: var(--orange); }
.meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
.fav-btn { background: var(--orange); color: #fff; border: none; padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: 'DM Sans', sans-serif; }

.tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }

.tab.on.ca  { background: var(--white);   color: var(--black); border-color: var(--white);   font-weight: 500; }
.tab.on.c0  { background: var(--s0);      color: #000;         border-color: var(--s0);      font-weight: 500; }
.tab.on.c1  { background: var(--s1);      color: #fff;         border-color: var(--s1);      font-weight: 500; }
.tab.on.c2  { background: var(--s2);      color: #000;         border-color: var(--s2);      font-weight: 500; }
.tab.on.c3  { background: var(--s3);      color: #fff;         border-color: var(--s3);      font-weight: 500; }

/* Type tabs — no color, just white when active */
.tab.on.ta  { background: var(--white);   color: var(--black); border-color: var(--white);   font-weight: 500; }
.tab.on.tm  { background: var(--white);   color: var(--black); border-color: var(--white);   font-weight: 500; }
.tab.on.tt  { background: var(--white);   color: var(--black); border-color: var(--white);   font-weight: 500; }
.tab.on.tc  { background: var(--white);   color: var(--black); border-color: var(--white);   font-weight: 500; }
.tab.on.tp  { background: var(--white);   color: var(--black); border-color: var(--white);   font-weight: 500; }
.tab.on.tf  { background: var(--orange);  color: #fff;         border-color: var(--orange);  font-weight: 500; }

.tdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }

/* ── FAV PANEL ── */
#fav-panel {
  display: none; position: fixed; z-index: 99;
  background: var(--off-black); border: 1px solid var(--orange);
  border-radius: 12px; padding: 12px; overflow-y: auto;
  left: 12px; right: 12px; max-height: 280px;
}
@media (min-width: 768px) {
  #fav-panel { left: auto; right: 16px; width: 380px; max-height: 420px; }
}
#fav-panel.show { display: block; }
.fav-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
#fav-panel h2 { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--orange); letter-spacing: 2px; }
.fav-close { background: rgba(255,255,255,0.1); border: none; color: var(--white); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.fav-close:hover { background: rgba(255,80,80,0.25); color: #ff7070; }
.fi { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 7px; padding: 8px 10px; margin-bottom: 5px; font-size: 12px; }
.fi-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.fi-name { font-weight: 500; flex: 1; min-width: 0; }
.fi-time { font-size: 10px; color: var(--muted); white-space: nowrap; margin-right: 4px; text-align: right; line-height: 1.4; }
.fi-rm { width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(255,80,80,0.2); color: #ff7070; font-size: 13px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.fi-rm:hover { background: rgba(255,80,80,0.4); }
.fi-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 12px; }

/* ── GRID AREA ── */
#grid-wrap {
  position: fixed; left: 0; right: 0; bottom: 0;
  overflow: scroll;
  -webkit-overflow-scrolling: touch;
  background: var(--black);
}

/* grid-inner stretches to full width of grid-wrap */
#grid-inner {
  display: flex;
  flex-direction: column;
  min-width: 100%;
  width: max-content;
  padding: 0 40px 60px;
}

#stage-row {
  display: flex; position: sticky; top: 0; z-index: 10;
  background: var(--black); border-bottom: 1px solid var(--border);
  padding: 6px 0 4px;
}

#grid-body { display: flex; padding-top: 16px; }
.time-gap { width: 50px; flex-shrink: 0; }
.sh { font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 1px; text-align: center; padding: 4px 4px 3px; }
.sh0 { color: var(--s0); border-bottom: 2px solid var(--s0); }
.sh1 { color: var(--s1); border-bottom: 2px solid var(--s1); }
.sh2 { color: var(--s2); border-bottom: 2px solid var(--s2); }
.sh3 { color: var(--s3); border-bottom: 2px solid var(--s3); }
#time-col { width: 50px; flex-shrink: 0; position: relative; }
.tl { position: absolute; right: 6px; font-size: 10px; color: var(--muted); transform: translateY(-50%); white-space: nowrap; }
.stage-col { position: relative; margin-right: 8px; }
.hl { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,0.04); pointer-events: none; }

.ec {
  position: absolute; left: 4px; right: 4px;
  background: var(--card); border: 1px solid var(--border);
  border-left: 3px solid var(--lc, #555);
  border-radius: 8px; padding: 7px 10px; overflow: hidden; cursor: pointer;
  transition: opacity 0.15s;
}
.ec.fav { border-color: var(--orange); border-left-color: var(--orange); background: rgba(232,137,26,0.1); }
.ec.hide { opacity: 0.06; pointer-events: none; }
.ec-type { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.6px; }
.ec-name { font-size: 11px; font-weight: 500; color: var(--white); line-height: 1.25; margin-top: 1px; }
.ec-time { font-size: 9px; color: var(--muted); margin-top: 1px; }
.ec-heart { position: absolute; top: 4px; right: 5px; font-size: 11px; }
</style>
</head>
<body>

<div id="header">
  <div class="header-row">
    <div>
      <div class="logo">Good <span>Vibes</span> Only</div>
      <div class="meta">20. Juni 2026 · Øresundsparken · Kl. 10–22 · <span style="color:var(--orange)">v2.8</span></div>
    </div>
    <button class="fav-btn" onclick="toggleFavPanel()">♥ Favoritter (<span id="fc">0</span>)</button>
  </div>
  <div class="tabs" id="stabs">
    <button class="tab ca on" onclick="setStage('all',this)">Alle scener</button>
    <button class="tab c0"   onclick="setStage(0,this)">🔦 Fyrtårnet</button>
    <button class="tab c1"   onclick="setStage(1,this)">❤️ Hjerterytmen</button>
    <button class="tab c2"   onclick="setStage(2,this)">☀️ Solstrålen</button>
    <button class="tab c3"   onclick="setStage(3,this)">💬 Dialog Scenen</button>
  </div>
  <div class="tabs" id="ttabs">
    <button class="tab ta on" onclick="setType('all',this)">Alle typer</button>
    <button class="tab tm"   onclick="setType('musik',this)"><span class="tdot" style="background:var(--musik)"></span>Musik</button>
    <button class="tab tt"   onclick="setType('talk',this)"><span class="tdot" style="background:var(--talk)"></span>Talk</button>
    <button class="tab tc"   onclick="setType('comedy',this)"><span class="tdot" style="background:var(--comedy)"></span>Comedy</button>
    <button class="tab tp"   onclick="setType('panel',this)"><span class="tdot" style="background:var(--panel)"></span>Panel</button>
    <button class="tab tf"   onclick="setType('fav',this)">⭐ Favoritter</button>
  </div>
</div>

<div id="fav-panel">
  <div class="fav-header">
    <h2>♥ Mine favoritter</h2>
    <button class="fav-close" onclick="toggleFavPanel()">✕</button>
  </div>
  <div id="fav-list"></div>
</div>

<div id="grid-wrap">
  <div id="grid-inner">
    <div id="stage-row"></div>
    <div id="grid-body">
      <div id="time-col"></div>
      <div id="cols" style="display:flex"></div>
    </div>
  </div>
</div>

<script>
const SF = localStorage.getItem('gvo-fav');
const favs = new Set(SF ? JSON.parse(SF).map(Number) : []);
let cStage = 'all', cType = 'all';

const DAY0=600, DAY1=1320, PPM=1.5, TIME_W=50;
const SC=['#F5A623','#E8524A','#F0C030','#5B9BD5'];
const stages=[
  {n:'🔦 Fyrtårnet',     s:'Hovedscene',    c:'sh0'},
  {n:'❤️ Hjerterytmen',  s:'Scene',         c:'sh1'},
  {n:'☀️ Solstrålen',    s:'Talks/Podcast', c:'sh2'},
  {n:'💬 Dialog Scenen', s:'Panel/Talks',   c:'sh3'},
];
const TC={musik:'#aaa',talk:'#aaa',comedy:'#aaa',panel:'#aaa'};
const TL={musik:'🎵 Musik',talk:'🎤 Talk/Podcast',comedy:'😄 Comedy',panel:'🗣️ Paneldebat'};

const evs=[
  {id:1, g:0,sM:690, eM:720, t:'musik',n:'Bifald',           ti:'11:30–12:00'},
  {id:2, g:0,sM:735, eM:780, t:'musik',n:'Dahlin',           ti:'12:15–13:00'},
  {id:3, g:0,sM:825, eM:870, t:'musik',n:'Teka',             ti:'13:45–14:30'},
  {id:4, g:0,sM:930, eM:975, t:'musik',n:'Chris de Sarandy', ti:'15:30–16:15'},
  {id:5, g:0,sM:1035,eM:1080,t:'musik',n:'Mae Hill',         ti:'17:15–18:00'},
  {id:6, g:0,sM:1140,eM:1185,t:'musik',n:'Jourdan Blue',     ti:'19:00–19:45'},
  {id:7, g:0,sM:1260,eM:1305,t:'musik',n:'Sonny Tennet',     ti:'21:00–21:45'},
  {id:8, g:1,sM:600, eM:645, t:'musik',n:'Scarlett',         ti:'10:00–10:45'},
  {id:9, g:1,sM:660, eM:705, t:'musik',n:'Trainman Blues',   ti:'11:00–11:45'},
  {id:10,g:1,sM:780, eM:825, t:'musik',n:'Joje',             ti:'13:00–13:45'},
  {id:11,g:1,sM:885, eM:930, t:'musik',n:"John D'Ambrosio",  ti:'14:45–15:30'},
  {id:12,g:1,sM:975, eM:1020,t:'musik',n:'Bjarne',           ti:'16:15–17:00'},
  {id:13,g:1,sM:1080,eM:1140,t:'panel',n:'Paneldebat del 1', ti:'18:00–19:00'},
  {id:14,g:1,sM:1200,eM:1260,t:'panel',n:'Paneldebat del 2', ti:'20:00–21:00'},
  {id:15,g:2,sM:600, eM:655, t:'talk',  n:'Når livet ikke er sort/hvidt',ti:'10:00–10:55'},
  {id:16,g:2,sM:660, eM:715, t:'talk',  n:'Talk om alkohol',              ti:'11:00–11:55'},
  {id:17,g:2,sM:780, eM:840, t:'comedy',n:'Comedy Show',                  ti:'13:00–14:00'},
  {id:18,g:2,sM:825, eM:870, t:'talk',  n:'Ludvigs Podcast',              ti:'13:45–14:30'},
  {id:19,g:2,sM:880, eM:930, t:'talk',  n:'LET LIVET',                    ti:'14:40–15:30'},
  {id:20,g:2,sM:960, eM:1010,t:'talk',  n:'Talk & Q&A',                   ti:'16:00–16:50'},
  {id:21,g:2,sM:1020,eM:1070,t:'talk',  n:'Lars Thiesgaard',              ti:'17:00–17:50'},
  {id:22,g:2,sM:1080,eM:1140,t:'panel', n:'Paneldebat del 1',             ti:'18:00–19:00'},
  {id:23,g:2,sM:1200,eM:1260,t:'panel', n:'Paneldebat del 2',             ti:'20:00–21:00'},
  {id:24,g:3,sM:600, eM:645, t:'talk', n:'Heart Songs',        ti:'10:00–10:45'},
  {id:25,g:3,sM:660, eM:715, t:'talk', n:'ADHD & Autisme',      ti:'11:00–11:55'},
  {id:26,g:3,sM:780, eM:825, t:'talk', n:'Bryd tabuet',         ti:'13:00–13:45'},
  {id:27,g:3,sM:825, eM:870, t:'talk', n:'Bryd tabuet – del 2', ti:'13:45–14:30'},
  {id:28,g:3,sM:870, eM:930, t:'talk', n:'Den Gode Gerning',    ti:'14:30–15:30'},
  {id:29,g:3,sM:960, eM:1010,t:'talk', n:'Dr. Tommy Pang',      ti:'16:00–16:50'},
  {id:30,g:3,sM:1020,eM:1065,t:'talk', n:'Samtaler om livet',   ti:'17:00–17:45'},
  {id:31,g:3,sM:1080,eM:1140,t:'panel',n:'Paneldebat del 1',    ti:'18:00–19:00'},
  {id:32,g:3,sM:1200,eM:1260,t:'panel',n:'Paneldebat del 2',    ti:'20:00–21:00'},
];

function ms(m){return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;}
function vis(e){
  const sg=cStage==='all'||e.g===cStage;
  const ty=cType==='all'?true:cType==='fav'?favs.has(e.id):e.t===cType;
  return sg&&ty;
}

function saveFav(id){
  if(favs.has(id)) favs.delete(id); else favs.add(id);
  localStorage.setItem('gvo-fav',JSON.stringify([...favs]));
  document.getElementById('fc').textContent=favs.size;
  render(); renderFavList();
}

function toggleFavPanel(){
  const p=document.getElementById('fav-panel');
  p.classList.toggle('show');
  localStorage.setItem('gvo-po',p.classList.contains('show'));
  positionFavPanel();
  renderFavList();
}

function positionFavPanel(){
  const h=document.getElementById('header').offsetHeight;
  document.getElementById('fav-panel').style.top=(h+6)+'px';
}

function renderFavList(){
  const list=document.getElementById('fav-list');
  const fe=evs.filter(e=>favs.has(e.id)).sort((a,b)=>a.sM-b.sM);
  if(!fe.length){list.innerHTML='<p class="fi-empty">Tryk på et event for at tilføje til favoritter</p>';return;}
  list.innerHTML=fe.map(e=>`
    <div class="fi">
      <div class="fi-dot" style="background:${SC[e.g]}"></div>
      <div class="fi-name">${e.n}</div>
      <div class="fi-time">${e.ti}<br>${stages[e.g].n}</div>
      <button class="fi-rm" onclick="saveFav(${e.id})">✕</button>
    </div>`).join('');
}

function setStage(s,btn){
  cStage=s==='all'?'all':Number(s);
  document.querySelectorAll('#stabs .tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function setType(t,btn){
  cType=t;
  document.querySelectorAll('#ttabs .tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

// Calculate column width to fill available space
function calcColWidth(numCols){
  const available = window.innerWidth - TIME_W - 80 - (numCols * 8); // subtract time col + padding + gaps
  const minW = 140;
  const natural = Math.floor(available / numCols);
  return Math.max(natural, minW);
}

function render(){
  const vg = cStage==='all' ? [0,1,2,3] : [cStage];
  const CW = calcColWidth(vg.length);
  const totalH = (DAY1-DAY0)*PPM;

  // Stage headers
  document.getElementById('stage-row').innerHTML =
    '<div class="time-gap"></div>' +
    vg.map(i=>`<div class="sh ${stages[i].c}" style="width:${CW}px">${stages[i].n}<div style="font-size:9px;font-weight:300;text-transform:none;letter-spacing:0;opacity:0.7">${stages[i].s}</div></div>`).join('');

  // Time axis
  const tc=document.getElementById('time-col');
  tc.style.height=totalH+'px';
  tc.innerHTML=Array.from({length:13},(_,i)=>{
    const m=DAY0+i*60;
    return `<div class="tl" style="top:${(m-DAY0)*PPM}px">${ms(m)}</div>`;
  }).join('');

  // Columns
  const cols=document.getElementById('cols');
  cols.innerHTML='';
  vg.forEach(si=>{
    const col=document.createElement('div');
    col.className='stage-col';
    col.style.cssText=`width:${CW}px;height:${totalH}px`;
    for(let m=DAY0;m<=DAY1;m+=60){
      const hl=document.createElement('div');
      hl.className='hl';
      hl.style.top=((m-DAY0)*PPM)+'px';
      col.appendChild(hl);
    }
    evs.filter(e=>e.g===si).forEach(e=>{
      const slotH = (e.eM-e.sM)*PPM - 4;
      const minH  = 58; // enough for type + name + time
      const h     = Math.max(slotH, minH);
      const top  = (e.sM-DAY0)*PPM;
      const f=favs.has(e.id),v=vis(e);
      const card=document.createElement('div');
      card.className=`ec${f?' fav':''}${!v?' hide':''}`;
      card.style.cssText=`top:${top}px;height:${h}px;--lc:${SC[si]}`;
      card.innerHTML=`<div class="ec-type" style="color:#aaa">${TL[e.t]}</div><div class="ec-name">${e.n}</div><div class="ec-time">${e.ti}</div><div class="ec-heart">${f?'❤️':'🤍'}</div>`;
      card.addEventListener('click',()=>saveFav(e.id));
      col.appendChild(card);
    });
    cols.appendChild(col);
  });
}

function setGridTop(){
  const h=document.getElementById('header').offsetHeight;
  document.getElementById('grid-wrap').style.top=h+'px';
}

window.addEventListener('resize',()=>{ setGridTop(); positionFavPanel(); render(); });
setGridTop();
render();
renderFavList();
document.getElementById('fc').textContent=favs.size;
if(localStorage.getItem('gvo-po')==='true'){
  document.getElementById('fav-panel').classList.add('show');
  positionFavPanel();
  renderFavList();
}
</script>
</body>
</html>
